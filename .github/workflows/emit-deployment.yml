name: Report deployment to Jira

on:
  push:
    branches:
      - main  # change if your prod branch is different

permissions:
  deployments: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Start deployment
        id: start
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.sha }}

      - name: Finish deployment
        if: always()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          status: ${{ job.status }}  # success | failure | cancelled
          deployment_id: ${{ steps.start.outputs.deployment_id }}
          env_url: https://mind-meld.co   # your live site URL
          auto_inactive: false
