name: Auto-generate Changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --production=false

      - name: Generate changelog
        run: npm run changelog:generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changelog changes
        id: verify-changed-files
        run: |
          if git diff --quiet src/changelog.html; then
            echo "No changelog changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changelog changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changelog
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add src/changelog.html
          git commit -m "Update changelog after merging PR #${{ github.event.number }}

          🤖 Generated with [Claude Code](https://claude.ai/code)

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push

      - name: Summary
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          echo "✅ Changelog automatically updated after PR #${{ github.event.number }}"
          echo "📝 Changes committed and pushed to main branch"
