name: Architecture Health Check

on:
  # Run on pull requests to main
  pull_request:
    branches: [main]

  # Run weekly on Sunday at 9 AM UTC
  schedule:
    - cron: '0 9 * * 0'

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # For PR comments

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Architecture Health Assessment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install analysis tools
        run: npm install --no-save madge jscpd depcheck npm-check-updates bc

      - name: Run Architecture Health Check
        id: health-check
        run: |
          ./scripts/health-check.sh > health-report.txt 2>&1
          echo "Health check completed"

      - name: Display Health Report
        run: cat health-report.txt

      - name: Check for Critical Issues
        id: check-critical
        run: |
          if grep -q "CRITICAL ISSUES" health-report.txt; then
            echo "critical_issues=true" >> $GITHUB_OUTPUT
            echo "❌ Critical architecture issues detected"
            exit 1
          elif grep -q "NEEDS ATTENTION" health-report.txt; then
            echo "needs_attention=true" >> $GITHUB_OUTPUT
            echo "⚠️ Architecture needs attention"
          else
            echo "health_good=true" >> $GITHUB_OUTPUT
            echo "✅ Architecture health is good"
          fi

      - name: Circular Dependencies Check
        run: |
          echo "🔍 Checking for circular dependencies..."
          if npx madge --circular --extensions js src/ 2>&1 | grep -q "Found.*circular"; then
            echo "❌ Circular dependencies found - blocking issue!"
            npx madge --circular --extensions js src/
            exit 1
          else
            echo "✅ No circular dependencies detected"
          fi

      - name: Security Audit
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level=moderate

      - name: Upload Health Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-health-report
          path: health-report.txt
          retention-days: 30

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const healthReport = fs.readFileSync('health-report.txt', 'utf8');

              // Extract key metrics
              const circularDeps = healthReport.includes('circular dependencies detected');
              const securityIssues = healthReport.includes('Security vulnerabilities detected');
              const healthScore = healthReport.match(/Score: (\d+)\/100/)?.[1];

              let comment = `## 🏥 Architecture Health Check Results\n\n`;

              if (circularDeps) {
                comment += `❌ **CRITICAL**: Circular dependencies detected - must be fixed before merge\n\n`;
              }

              if (securityIssues) {
                comment += `🔒 **SECURITY**: Vulnerabilities found - run \`npm audit fix\`\n\n`;
              }

              if (healthScore) {
                const scoreEmoji = healthScore >= 90 ? '🏆' : healthScore >= 75 ? '✅' : healthScore >= 60 ? '⚠️' : '🚨';
                comment += `${scoreEmoji} **Health Score**: ${healthScore}/100\n\n`;
              }

              comment += `<details>\n<summary>📊 Full Health Report</summary>\n\n\`\`\`\n${healthReport}\n\`\`\`\n</details>\n\n`;
              comment += `💡 **Next Steps**: Review TODO.md for detailed remediation guidance\n`;
              comment += `🔄 **Rerun**: Trigger this check with a new commit or manual workflow dispatch`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not read health report file:', error.message);
            }
