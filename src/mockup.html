<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MindMeld – Interaction Hub Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --panel:#fff; --canvas:#f7f7f5; --ink:#15171a; --muted:rgba(21,23,26,.55);
      --yellow:#ffd54f; --green:#8ed39c; --blue:#7fb4ff; --pink:#f6b6b0; --grey:#cfd3d8;
      --ring:0 0 0 3px rgba(255,213,79,.35);
      --shadow:0 10px 30px rgba(18,20,22,.14), 0 2px 8px rgba(18,20,22,.08);
      --ease:cubic-bezier(.22,.61,.36,1);
      --radius:14px; --radius-sm:10px;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:"Inter Tight", Inter, system-ui, Segoe UI, Roboto, Helvetica, Arial; letter-spacing:.1px; color:var(--ink); background:var(--canvas)}

    /* Canvas placeholder */
    .canvas{
      position:relative; height:520px; margin:24px auto; max-width:980px; border-radius:16px;
      background:#fff; box-shadow:var(--shadow);
      background-image:radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px); background-size:20px 20px; overflow:hidden;
    }

    /* Interaction Hub (launcher) */
    .hub{
      position:absolute; top:22px; right:22px; z-index:10; display:flex; align-items:center; gap:8px; padding:8px;
      border-radius:999px; background:rgba(255,255,255,.9);
      backdrop-filter:saturate(140%) blur(6px);
      box-shadow:0 1px 0 rgba(0,0,0,.06), var(--shadow);
    }
    .swatch{width:18px; height:18px; border-radius:999px; box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 1px 0 rgba(0,0,0,.08)}
    .swatch.y{background:var(--yellow)} .swatch.g{background:var(--green)} .swatch.b{background:var(--blue)}
    .swatch.p{background:var(--pink)} .swatch.o{background:var(--grey)}
    .kebab{
      appearance:none; border:0; background:#fff; width:32px; height:32px; border-radius:999px;
      display:grid; place-items:center; cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,.06);
    }
    .kebab svg{width:18px; height:18px; fill:var(--muted)}
    .kebab:hover{filter:brightness(.98)}
    .hub:focus-within{box-shadow:var(--ring), var(--shadow)}

    /* gentle idle hint */
    @media (prefers-reduced-motion:no-preference){
      .hub{animation:breathe 6s var(--ease) infinite}
      @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
    }

    /* Menu */
    .menu{
      position:absolute; width:280px; background:var(--panel); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:6px; opacity:0; transform:translateY(-6px) scale(.98);
      pointer-events:none; transition:opacity .16s var(--ease), transform .16s var(--ease);
      max-height:calc(100vh - 48px); overflow:auto;
    }
    .menu.open{opacity:1; transform:translateY(0) scale(1); pointer-events:auto}
    .group{margin:6px 0}
    .subtitle{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); padding:6px 10px}
    .item{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding:12px 14px; border-radius:var(--radius-sm); cursor:pointer; font-weight:500; font-size:14.5px; letter-spacing:.2px;
    }
    .item:hover{background:rgba(18,20,22,.05)}
    .item .kbd{font-size:11px; color:var(--muted)}
    .divider{height:1px; background:rgba(18,20,22,.08); margin:4px 6px; border-radius:1px}

    /* Bottom sheet handle */
    .handle{display:none;}

    /* Mobile: turn into a bottom sheet with drag handle */
    @media (max-width:720px){
      .hub{top:auto; bottom:18px; right:18px; padding:10px 12px; gap:0; background:#fff}
      .swatch{display:none}
      .kebab{width:56px; height:56px}

      .menu{
        position:fixed; inset:auto 0 0 0; width:100%; right:auto; top:auto;
        border-radius:16px 16px 0 0; transform:translateY(12px); max-height:85vh;
      }
      .menu.open{transform:translateY(0)}
      .handle{
        display:block; width:40px; height:4px; background:rgba(0,0,0,.2); border-radius:2px; margin:8px auto 12px;
        touch-action:none;
      }
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Canvas mockup">
    <!-- Interaction Hub -->
    <div class="hub" id="hub">
      <div class="swatch y" title="Yellow"></div>
      <div class="swatch g" title="Green"></div>
      <div class="swatch b" title="Blue"></div>
      <div class="swatch p" title="Pink"></div>
      <div class="swatch o" title="Grey"></div>
      <button class="kebab" id="hubBtn" aria-haspopup="true" aria-controls="ctx" aria-expanded="false" aria-label="Open menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a1.75 1.75 0 110-3.5A1.75 1.75 0 0112 7zm0 6a1.75 1.75 0 110-3.5A1.75 1.75 0 0112 13zm0 6a1.75 1.75 0 110-3.5A1.75 1.75 0 0112 19z"/></svg>
      </button>
    </div>

    <!-- Context Menu / Bottom Sheet -->
    <div class="menu" id="ctx" role="menu" aria-label="MindMeld menu" aria-hidden="true">
      <div class="handle" aria-hidden="true"></div>

      <div class="group">
        <div class="subtitle">Canvas</div>
        <div class="item"><span>Clear Canvas</span><span class="kbd">Del</span></div>
      </div>
      <div class="divider"></div>

      <div class="group">
        <div class="subtitle">File</div>
        <div class="item"><span>Import from File</span><span class="kbd">Ctrl/Cmd I</span></div>
        <div class="item"><span>Export to File</span><span class="kbd">Ctrl/Cmd E</span></div>
        <div class="item"><span>Copy to Clipboard</span></div>
        <div class="item"><span>Paste from Clipboard</span></div>
      </div>
      <div class="divider"></div>

      <div class="group">
        <div class="subtitle">Templates</div>
        <div class="item"><span>Change Template</span></div>
      </div>
      <div class="divider"></div>

      <div class="group">
        <div class="subtitle">Help</div>
        <div class="item"><span>Instructions</span></div>
        <div class="item"><span>About</span></div>
        <div class="item"><span>Changelog</span></div>
      </div>
      <div class="divider"></div>

      <div class="group">
        <div class="subtitle">Account</div>
        <div class="item"><span>Sign in / Connect</span></div>
        <div class="item"><span>Settings</span></div>
      </div>
    </div>
  </main>

  <script>
    const btn = document.getElementById('hubBtn');
    const menu = document.getElementById('ctx');

    function closeMenu(){
      menu.classList.remove('open');
      menu.setAttribute('aria-hidden','true');
      btn.setAttribute('aria-expanded','false');
      menu.style.transform = ''; // reset any drag transform
    }

    function positionMenu(){
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const margin = 16;
      const gap = 8;

      // Mobile: bottom sheet full width
      if (vw <= 720){
        menu.style.position = 'fixed';
        menu.style.top = '';
        menu.style.left = '0';
        menu.style.right = '0';
        menu.style.bottom = '0';
        menu.style.width = '100%';
        menu.style.borderRadius = '16px 16px 0 0';
        return;
      }

      // Desktop/tablet: place near hub, never off-screen
      const rect = btn.getBoundingClientRect();

      // Temporarily make sure we measure true size
      const prevVis = menu.style.visibility;
      const prevDisp = menu.style.display;
      menu.style.visibility = 'hidden';
      menu.style.display = 'block';

      const menuRect = menu.getBoundingClientRect();

      // Prefer below; flip above if needed
      let top = rect.bottom + gap;
      if (top + menuRect.height > vh - margin){
        top = rect.top - menuRect.height - gap;
      }

      // Prefer align-left with hub; shift/clamp as needed
      let left = rect.left;
      if (left + menuRect.width > vw - margin){
        left = vw - menuRect.width - margin;
      }
      if (left < margin) left = margin;

      menu.style.position = 'absolute';
      menu.style.top  = `${top + window.scrollY}px`;
      menu.style.left = `${left + window.scrollX}px`;
      menu.style.width = '';

      // Restore styles
      menu.style.visibility = prevVis;
      menu.style.display = prevDisp || '';
    }

    function openMenu(){
      positionMenu();
      menu.classList.add('open');
      menu.removeAttribute('aria-hidden');
      btn.setAttribute('aria-expanded','true');
    }

    // Toggle
    btn.addEventListener('click', ()=>{
      const isOpen = menu.classList.contains('open');
      isOpen ? closeMenu() : openMenu();
    });

    // Click-away & Esc
    document.addEventListener('click', (e)=>{
      if (!menu.contains(e.target) && !btn.contains(e.target)) closeMenu();
    });
    document.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape') closeMenu();
    });

    // Reposition on resize (desktop <-> mobile)
    window.addEventListener('resize', ()=>{
      if (menu.classList.contains('open')) positionMenu();
    });

    // --- Mobile swipe-to-close (handle-only) ---
    const handle = menu.querySelector('.handle');
    let startY = 0, currentY = 0, dragging = false;

    function onTouchStart(e){
      if (window.innerWidth > 720) return;
      if (!e.target.closest('.handle')) return; // start only from handle
      startY = e.touches[0].clientY;
      currentY = startY;
      dragging = true;
      menu.style.transition = 'transform 0.2s ease'; // used on snap back
      // Disable scroll while dragging
      document.body.style.overflow = 'hidden';
    }
    function onTouchMove(e){
      if (!dragging) return;
      currentY = e.touches[0].clientY;
      const diff = currentY - startY;
      if (diff > 0){
        menu.style.transform = `translateY(${diff}px)`;
      } else {
        menu.style.transform = ''; // no upward drag
      }
    }
    function onTouchEnd(){
      if (!dragging) return;
      dragging = false;
      const diff = currentY - startY;
      // Re-enable scroll
      document.body.style.overflow = '';
      if (diff > 50){
        closeMenu(); // dismiss
      } else {
        menu.style.transform = ''; // snap back
      }
    }

    // Passive listeners for smoother scrolling
    menu.addEventListener('touchstart', onTouchStart, { passive: true });
    menu.addEventListener('touchmove',  onTouchMove,  { passive: true });
    menu.addEventListener('touchend',   onTouchEnd);
  </script>
</body>
</html>
