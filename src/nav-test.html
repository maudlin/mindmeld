<div class="canvas" style="position:relative;width:600px;height:240px;background:#f9fafb;">
  <!-- Example connector -->
  <svg viewBox="0 0 600 240" style="position:absolute;inset:0;pointer-events:none">
    <line x1="60" y1="40" x2="520" y2="200" stroke="#9aa3af" stroke-width="2" stroke-dasharray="6 6"/>
  </svg>

  <!-- Anchor at midpoint (position this programmatically from your connector geometry) -->
  <div class="hub" style="
    position:absolute; left:290px; top:120px; width:16px; height:16px; 
    border-radius:50%; background:#fff; border:2px solid #64748b; cursor:pointer;">
  </div>

  <!-- Floating capsule (toggle .hidden) -->
  <div class="capsule hidden" style="
    position:absolute; left:278px; top:68px; width:44px; height:104px; 
    background:#fff; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.18); display:flex; flex-direction:column; align-items:center; justify-content:space-around;">
    <button aria-label="Delete" style="width:32px;height:32px;border-radius:50%;border:none;background:#fff;">
      <span style="display:block;width:24px;height:24px;border-radius:50%;background:#FF6B6B"></span>
    </button>
    <div style="width:80%;height:1px;background:#e5e7eb;"></div>
    <button aria-label="Edit or Code" style="width:32px;height:32px;border-radius:50%;border:none;background:#fff;">
      <span style="display:block;width:24px;height:24px;border-radius:50%;background:#6366F1"></span>
    </button>
  </div>

  <script>
    const hub = document.querySelector('.hub');
    const capsule = document.querySelector('.capsule');
    function toggle(){ capsule.classList.toggle('hidden'); }
    function close(e){
      if (!capsule.contains(e.target) && e.target !== hub) capsule.classList.add('hidden');
    }
    hub.addEventListener('click', toggle);
    document.addEventListener('click', close);
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') capsule.classList.add('hidden'); });

    // Hover affordance (optional)
    document.querySelectorAll('.capsule button').forEach(b=>{
      b.addEventListener('pointerdown', ()=> b.style.background='#f3f4f6');
      b.addEventListener('pointerup', ()=> b.style.background='#fff');
      b.addEventListener('pointerleave', ()=> b.style.background='#fff');
    });
  </script>
  <style>
    .hidden{ display:none; }
  </style>
</div>
