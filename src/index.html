<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindMeld</title>
    <link rel="stylesheet" href="css/styles.css?v=1.0.1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=block"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Over+the+Rainbow&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="img/icon16.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="img/icon16.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="app-version" content="1.0.1">
    <meta name="build-date" content="2025-09-08">
  </head>
  <body>
    <nav id="navbar">
      <div id="logo">
        <img src="img/icon64.png" alt="MindMeld Logo" id="logo-icon" />
        mindmeld
      </div>
      <ul id="menu">
        <li class="menu-item">
          <a href="about.html" class="menu-link">About</a>
        </li>
      </ul>
      <!-- Hidden elements for kebab menu functionality -->
      <div style="display: none">
        <button id="import-from-file-button">Import from File</button>
        <button id="export-to-file-button">Export to File</button>
        <button id="export-to-clipboard-button">Copy to Clipboard</button>
        <button id="import-from-clipboard-button">Paste from Clipboard</button>
        <button id="clear-canvas-button">Clear Canvas</button>
        <div id="canvas-style-dropdown"></div>
      </div>
    </nav>

    <!-- Color Picker UI - Fixed top-center position -->
    <div id="color-picker-container" class="color-picker">
      <div class="color-picker-palette">
        <div
          class="color-swatch active"
          data-color="yellow"
          role="button"
          tabindex="0"
          aria-label="Select yellow color"
        ></div>
        <div
          class="color-swatch"
          data-color="pink"
          role="button"
          tabindex="0"
          aria-label="Select pink color"
        ></div>
        <div
          class="color-swatch"
          data-color="green"
          role="button"
          tabindex="0"
          aria-label="Select green color"
        ></div>
        <div
          class="color-swatch"
          data-color="blue"
          role="button"
          tabindex="0"
          aria-label="Select blue color"
        ></div>
        <div
          class="kebab-menu-button"
          id="kebab-menu-button"
          role="button"
          aria-haspopup="true"
          aria-controls="kebab-context-menu"
          aria-expanded="false"
          aria-label="Open menu"
          tabindex="0"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 7a1.75 1.75 0 110-3.5A1.75 1.75 0 0112 7zm0 6a1.75 1.75 0 110-3.5A1.75 1.75 0 0112 13zm0 6a1.75 1.75 0 110-3.5A1.75 1.75 0 0112 19z"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Kebab Context Menu -->
    <div
      class="kebab-context-menu"
      id="kebab-context-menu"
      role="menu"
      aria-label="Canvas menu"
      aria-hidden="true"
    >
      <div class="kebab-menu-handle" aria-hidden="true"></div>

      <div class="kebab-menu-group">
        <div class="kebab-menu-subtitle">Canvas</div>
        <div
          class="kebab-menu-item"
          role="menuitem"
          data-action="clear-canvas"
          tabindex="0"
        >
          <span>Clear Canvas</span>
        </div>
      </div>
      <div class="kebab-menu-divider"></div>

      <div class="kebab-menu-group">
        <div class="kebab-menu-subtitle">File</div>
        <div
          class="kebab-menu-item"
          role="menuitem"
          data-action="import-file"
          tabindex="0"
        >
          <span>Import from File</span>
        </div>
        <div
          class="kebab-menu-item"
          role="menuitem"
          data-action="export-file"
          tabindex="0"
        >
          <span>Export to File</span>
        </div>
        <div
          class="kebab-menu-item"
          role="menuitem"
          data-action="copy-clipboard"
          tabindex="0"
        >
          <span>Copy to Clipboard</span>
        </div>
        <div
          class="kebab-menu-item"
          role="menuitem"
          data-action="paste-clipboard"
          tabindex="0"
        >
          <span>Paste from Clipboard</span>
        </div>
      </div>
      <div class="kebab-menu-divider"></div>

      <div class="kebab-menu-group">
        <div class="kebab-menu-subtitle">Server</div>
        <div
          class="kebab-menu-item server-connect-item"
          role="menuitem"
          data-action="connect-server"
          tabindex="0"
        >
          <span class="server-menu-text">Connect to Server...</span>
          <div class="server-status-dot" style="display: none"></div>
        </div>
        <div
          class="kebab-menu-item server-disconnect-item"
          role="menuitem"
          data-action="disconnect-server"
          tabindex="0"
          style="display: none"
        >
          <span>Disconnect from Server</span>
        </div>
        <div
          class="kebab-menu-item server-load-item"
          role="menuitem"
          data-action="load-from-server"
          tabindex="0"
          style="display: none"
        >
          <span>Load from Server</span>
        </div>
      </div>
    </div>

    <div id="canvas-container">
      <div id="canvas">
        <div id="watermark">mindmeld</div>
      </div>
    </div>
    <div id="help-text"></div>
    <div id="zoom-display">5x</div>

    <!-- Server Connection Modal -->
    <div
      id="server-connection-modal"
      class="server-modal"
      style="display: none"
      role="dialog"
      aria-labelledby="server-modal-title"
      aria-modal="true"
    >
      <div class="server-modal-content">
        <div class="server-modal-header">
          <h2 id="server-modal-title">Connect to Server</h2>
          <button
            type="button"
            class="modal-close server-modal-close"
            aria-label="Close modal"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <form id="server-connection-form" class="server-connection-form">
          <div class="form-group">
            <label for="server-uri-input" class="form-label">
              Server URL
              <span class="form-help"
                >Enter the HTTPS URL of your MindMeld server (HTTP allowed for
                localhost)</span
              >
            </label>
            <input
              type="text"
              id="server-uri-input"
              class="form-input"
              placeholder="https://api.example.com or http://localhost:3000"
              required
            />
          </div>

          <div class="form-actions">
            <button
              type="submit"
              id="connect-server-btn"
              class="btn btn-primary"
            >
              Connect
            </button>
          </div>

          <div class="server-connection-status" id="connection-status">
            <!-- Connection progress and status messages will appear here -->
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="js/app.js?v=1.0.1"></script>
  </body>
</html>
