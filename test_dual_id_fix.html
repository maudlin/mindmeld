<!DOCTYPE html>
<html>
<head>
    <title>Dual ID Fix Test</title>
</head>
<body>
    <div id="canvas"></div>
    
    <script type="module">
        import { NoteService } from './src/js/services/noteService.js';
        
        // Test the dual ID fix
        const canvas = document.getElementById('canvas');
        
        // Create a note with original ID from import/restore
        const noteData = {
            id: 'abc123',  // Original ID
            content: 'Test note',
            left: '100px',
            top: '100px'
        };
        
        const note = NoteService.createNoteFromData(noteData, canvas);
        
        console.log('=== Dual ID Fix Test ===');
        console.log('DOM ID:', note.id);
        console.log('Data ID:', note.dataset.id);
        console.log('IDs match:', note.id === note.dataset.id);
        console.log('Expected: true (both should be "abc123")');
        
        if (note.id === note.dataset.id && note.id === 'abc123') {
            console.log('✅ DUAL ID FIX WORKING!');
        } else {
            console.log('❌ Dual ID fix failed');
        }
    </script>
</body>
</html>
