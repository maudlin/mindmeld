<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Markdown Rendering</title>
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .test-note {
            border: 2px solid #ccc;
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .view-mode {
            background: #f0f0f0;
        }
        .edit-mode {
            background: #ffffcc;
        }
        button {
            margin: 5px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <h1>Test Markdown Rendering</h1>
    
    <div id="test-note" class="test-note">
        <div id="note-content" class="note-content"></div>
    </div>
    
    <div>
        <button onclick="testViewMode()">Test View Mode</button>
        <button onclick="testEditMode()">Test Edit Mode</button>
        <button onclick="testFocus()">Test Focus</button>
        <button onclick="testBlur()">Test Blur</button>
    </div>
    
    <div id="status"></div>

    <script type="module">
        import { displayAsViewMode, displayAsEditMode, getCurrentMarkdownContent } from '/js/features/note/editViewMode.js';
        
        const noteContent = document.getElementById('note-content');
        const status = document.getElementById('status');
        
        // Initial markdown content
        const testMarkdown = '# Test Header\n**Bold** text\n*Italic* text\n- List item';
        
        // Set up focus/blur handlers
        noteContent.addEventListener('focus', () => {
            console.log('Focus event triggered');
            displayAsEditMode(noteContent);
            status.textContent = 'Status: Edit Mode (focused)';
        });
        
        noteContent.addEventListener('blur', () => {
            console.log('Blur event triggered');
            const markdown = getCurrentMarkdownContent(noteContent);
            displayAsViewMode(noteContent, markdown);
            status.textContent = 'Status: View Mode (blurred)';
        });
        
        // Start in view mode
        displayAsViewMode(noteContent, testMarkdown);
        status.textContent = 'Status: View Mode (initial)';
        
        // Make functions global for button onclick
        window.testViewMode = () => {
            displayAsViewMode(noteContent, testMarkdown);
            status.textContent = 'Status: View Mode (button)';
        };
        
        window.testEditMode = () => {
            displayAsEditMode(noteContent, testMarkdown);
            status.textContent = 'Status: Edit Mode (button)';
        };
        
        window.testFocus = () => {
            noteContent.focus();
        };
        
        window.testBlur = () => {
            noteContent.blur();
        };
    </script>
</body>
</html>
